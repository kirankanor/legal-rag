[project]
name = "legal-rag"
version = "1.0.0"
description = "RAG for indian citizenship legal firm"
requires-python = ">=3.12"

dependencies = [
    # LangChain & LLM
    "langchain",
    "langchain-groq",
    # Vector DB & Embeddings
    "qdrant-client",
    "sentence-transformers",
    # Document Processing
    "docling",
    # Utilities
    "python-dotenv",
    "pydantic-settings",
    "langchain-text-splitters>=1.1.3",
    "ipykernel>=7.4.0",
    "langchain-community>=0.4.2",
    "transformers>=5.19.0",
]

[tool.uv.workspace]
members = [
    "tools/raglens",
]

[tool.uv.sources]
raglens-parser-chunker-lab = { workspace = true, editable = true }

